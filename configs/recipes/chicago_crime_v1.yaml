dataset: "chicago_crime"
recipe: "chicago_crime_v1"

# Spatial configuration
grid:
  size_m: 300  # 300m x 300m grid cells
  origin: [0.0, 0.0]  # Fixed origin in EPSG:26971 meters, shared across batches

# Temporal configuration
temporal:
  time_bin: "6h"  # 6-hour time bins
  components:
    - hour_of_day
    - day_of_week
    - month
    - is_weekend

# Feature engineering
# Phase 1 (2026-11-15): every key below is produced by the recipe — see
# docs/design-notes/phase1-causality.md for the causality convention
# (a feature row at bin t predicts bin t + 1) and the panel design.
# The panel is completed with explicit zeros before any window or lag;
# categorical counts are top-10 + "other" per column (cardinality guardrail).
features:
  # Basic counts per grid cell and time bin (implemented by ChicagoCountStep)
  count_features: true
  # Per-category counts, shares and Shannon entropy (CategoryCountsStep)
  categorical_features:
    - primary_type
    - location_description
  categorical_top_n: 10
  # Rolling windows: lags count_lag_<d> and rolling means count_ma_<d>
  aggregation_windows:
    - "1d"
    - "7d"
    - "30d"
  # Explicit-zero panel completion (5,242 cells x 364 bins = 1,908,088 rows)
  complete_panel: true
  panel_min_periods: 1
  # Exponentially weighted mean of count (count_ewma_7d)
  ewma_halflife_days: 7.0
  # Sin/cos calendar encodings for hour, day-of-week, month
  cyclical_encoding: true
  # Queen spatial lag of the shortest lag (count_lag_1_spatial_lag)
  spatial_lag: true
  # Phase 2 (2026-11-15): multi-scale queen-ring spatial lag of the
  # shortest lag (count_lag_1_spatial_lag_r1/r2/r3); ring 1 reproduces the
  # phase-1 single-scale lag. Gaussian KDE of the shortest lag
  # (count_lag_1_kde, 600 m). Separable space-time KDE of count
  # (count_stkde, 600 m / 7 d half-life). Near-repeat ring counts
  # (count_nr_r*_7d / _7_14d) plus the count_nr_event_7d flag.
  # Fixed-kernel Hawkes excitation of count (count_hawkes_7d).
  spatial_lag_rings: [1, 2, 3]
  kde_bandwidth_m: 600.0
  stkde_bandwidth_m: 600.0
  stkde_halflife_days: 7.0
  near_repeat: true
  hawkes_halflife_days: 7.0
  # Ratio of shortest to longest rolling mean (count_ma_1_vs_count_ma_30)
  trend: true
  # Time since last event + burstiness over trailing 28 d
  recency: true
  # Active flag (7 d) + share of non-zero bins (28 d)
  zero_features: true

# Context enrichment (disabled for baseline).
# Enabling any source raises a blocking error: context enrichment is not
# wired into this recipe yet (see the design note above).
context:
  weather:
    enabled: false
  events:
    enabled: false
  demographics:
    enabled: false

# Output configuration
# partition_by used to be declared here but was silently ignored (the CLI
# writes a single file). It was removed; re-adding it raises a blocking error.
output:
  format: "parquet"
  compression: "snappy"
